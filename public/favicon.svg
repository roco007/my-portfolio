  <line x1="160" y1="40" x2="160" y2="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" transform="rotate(70 160 160)" />
  <line x1="160" y1="35" x2="160" y2="46" stroke="#ff4b4b" stroke-width="2" transform="rotate(80 160 160)" />
  <line x1="160" y1="40" x2="160" y2="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" transform="rotate(90 160 160)" />
