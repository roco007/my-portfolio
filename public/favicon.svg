  <!-- Rotating Reticles -->
  <g class="spinFwd"><circle cx="160" cy="160" r="88" fill="none" stroke="rgba(0, 255, 170, 0.35)" stroke-width="1.4" stroke-dasharray="10 14" /></g>
  <g class="spinRev"><circle cx="160" cy="160" r="78" fill="none" stroke="rgba(255, 75, 75, 0.4)" stroke-width="1.2" stroke-dasharray="6 12" /></g>

  <!-- Central Octagonal Core Plate -->
  <polygon points="112,86 208,86 234,112 234,208 208,234 112,234 86,208 86,112" fill="url(#centerPlateBg)" stroke="rgba(255, 75, 75, 0.55)" stroke-width="2" />
  <polygon points="112,86 208,86 234,112 234,208 208,234 112,234 86,208 86,112" fill="url(#frontRaster)" opacity="0.65" />

  <!-- Cybernetic Corner Target Brackets -->
  <path d="M 94,112 L 94,94 L 112,94" fill="none" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 226,112 L 226,94 L 208,94" fill="none" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 94,208 L 94,226 L 112,226" fill="none" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="square" />
  <path d="M 226,208 L 226,226 L 208,226" fill="none" stroke="#00ffaa" stroke-width="2.2" stroke-linecap="square" />

  <!-- Crosshair Guides -->
  <line x1="78" y1="160" x2="86" y2="160" stroke="#ff4b4b" stroke-width="1.6" />
  <line x1="234" y1="160" x2="242" y2="160" stroke="#ff4b4b" stroke-width="1.6" />
  <line x1="160" y1="78" x2="160" y2="86" stroke="#ff4b4b" stroke-width="1.6" />
  <line x1="160" y1="234" x2="160" y2="242" stroke="#ff4b4b" stroke-width="1.6" />

  <!-- RC Monogram — text-based so scramble can animate the characters -->
  <!-- Cyan RGB-split glitch slice -->
  <text id="rcCyan" x="160" y="172" text-anchor="middle" dominant-baseline="middle"
        fill="#00ffea" font-size="96" font-family="'Courier New', monospace"
        font-weight="900" letter-spacing="4" class="glitchCyan"
        style="pointer-events:none;">RC</text>

  <!-- Red/Magenta RGB-split glitch slice -->
  <text id="rcRed" x="160" y="172" text-anchor="middle" dominant-baseline="middle"
        fill="#ff0055" font-size="96" font-family="'Courier New', monospace"
        font-weight="900" letter-spacing="4" class="glitchRed"
        style="pointer-events:none;">RC</text>

  <!-- Base text — gradient fill, twitching, scrambled by script -->
  <text id="rcBase" x="160" y="172" text-anchor="middle" dominant-baseline="middle"
        fill="url(#rcGrad)" font-size="96" font-family="'Courier New', monospace"
        font-weight="900" letter-spacing="4" class="glitchBase"
        style="filter: drop-shadow(0 0 8px rgba(255,75,75,0.7)); pointer-events:none;">RC</text>

  <!-- Horizontal Glitch Scan Bar -->
  <rect x="88" y="0" width="144" height="3" fill="#00ffea" opacity="0.8" class="glitchScanBar" />

  <!-- High-Tech Micro Accents -->
  <circle cx="160" cy="116" r="2.2" fill="#00ffaa" />
  <circle cx="160" cy="204" r="2.2" fill="#00ffaa" />
  <rect x="157" y="157" width="6" height="6" fill="#ff4b4b" transform="rotate(45 160 160)" />

  <!-- Scramble script — drives all three text elements in sync -->
  <script type="text/javascript"><![CDATA[
    (function() {
      var GLYPHS = '0101_#@$%=+-~*<>[]{}/\\^!&?░▒▓█▀▄▌▐▖▗▘▙▚▛▜▝▞▟■▲△♢♡♤♧♣♤ SELECT >';
      var original = 'RC';
      var base = document.getElementById('rcBase');
      var cyan = document.getElementById('rcCyan');
      var red  = document.getElementById('rcRed');
      if (!base) return;
      var totalFrames = 18, intervalMs = 35, pauseMs = 900;

      function runCycle() {
        var iteration = 0;
        var timer = setInterval(function() {
          var text = original.split('').map(function(ch, i) {
            if (i < (iteration / totalFrames) * original.length) return ch;
            return GLYPHS[Math.floor(Math.random() * GLYPHS.length)];
          }).join('');
          base.textContent = text;
          if (cyan) cyan.textContent = text;
          if (red)  red.textContent  = text;
          iteration++;
          if (iteration >= totalFrames) {
            base.textContent = original;
            if (cyan) cyan.textContent = original;
            if (red)  red.textContent  = original;
            clearInterval(timer);
            setTimeout(runCycle, pauseMs);
          }
        }, intervalMs);
      }

      setTimeout(runCycle, 400);
    })();
  ]]></script>
</svg>
