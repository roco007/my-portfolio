<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="discBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#242220" />
      <stop offset="65%" stop-color="#141312" />
      <stop offset="100%" stop-color="#080807" />
    </radialGradient>
    <radialGradient id="centerPlateBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#281a1d" />
      <stop offset="65%" stop-color="#151012" />
      <stop offset="100%" stop-color="#090809" />
    </radialGradient>
    <linearGradient id="rcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="22%" stop-color="#ffa2b4" />
      <stop offset="60%" stop-color="#ff4b4b" />
      <stop offset="100%" stop-color="#db1f26" />
    </linearGradient>
    <pattern id="frontRaster" width="6" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="2" x2="6" y2="2" stroke="#ff4b4b" stroke-width="1.2" opacity="0.32" />
    </pattern>
    <filter id="intenseGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes reticleSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes reticleSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { filter: drop-shadow(0 0 5px rgba(255, 75, 75, 0.45)); transform: scale(0.992); }
        50% { filter: drop-shadow(0 0 14px rgba(255, 75, 75, 0.85)); transform: scale(1.012); }
      }
      .spinFwd {
        transform-origin: 160px 160px;
        animation: reticleSpin 24s linear infinite;
      }
      .spinRev {
        transform-origin: 160px 160px;
        animation: reticleSpinRev 18s linear infinite;
      }
      .glitchBase {
        transform-origin: 160px 160px;
        animation: glitchTwitch 2.4s infinite;
      }
      @keyframes glitchTwitch {
        0%, 82%, 100% { transform: translate(0, 0) skew(0deg); }
        83% { transform: translate(-1.5px, 0.5px) skew(-0.8deg); }
        85% { transform: translate(1px, -0.5px) skew(0.6deg); }
        87% { transform: translate(-2px, 0.2px) skew(-1.2deg); }
        89% { transform: translate(1.5px, -0.5px) skew(0.8deg); }
        91% { transform: translate(-0.5px, 0.5px) skew(0deg); }
        93% { transform: translate(0.5px, -0.5px) skew(0deg); }
        96% { transform: translate(-1px, 0px) skew(-0.5deg); }
        98% { transform: translate(0.5px, 0px) skew(0deg); }
      }
      .glitchCyan {
        opacity: 0.85;
        animation: glitchSliceCyan 1.8s infinite steps(2, start);
      }
      @keyframes glitchSliceCyan {
        0% { clip-path: inset(18% 0 62% 0); transform: translate(-2.5px, 1px); opacity: 0.85; }
        8% { clip-path: inset(58% 0 18% 0); transform: translate(2px, -1px); opacity: 0.6; }
        16% { clip-path: inset(82% 0 4% 0); transform: translate(-3px, 0.5px); opacity: 0.9; }
        24% { clip-path: inset(2% 0 88% 0); transform: translate(1.5px, -0.5px); opacity: 0.3; }
        32% { clip-path: inset(42% 0 42% 0); transform: translate(-2px, 1.5px); opacity: 0.8; }
        40% { clip-path: inset(72% 0 8% 0); transform: translate(3px, -1px); opacity: 0.95; }
        48% { clip-path: inset(22% 0 62% 0); transform: translate(-1.5px, -0.5px); opacity: 0.4; }
        56% { clip-path: inset(6% 0 84% 0); transform: translate(2.5px, 1px); opacity: 0.85; }
        64% { clip-path: inset(62% 0 22% 0); transform: translate(-3px, -1px); opacity: 0.7; }
        72% { clip-path: inset(32% 0 48% 0); transform: translate(2px, 0.5px); opacity: 0.9; }
        80% { clip-path: inset(86% 0 2% 0); transform: translate(-1.5px, 1px); opacity: 0.3; }
        88% { clip-path: inset(12% 0 68% 0); transform: translate(3px, -1.5px); opacity: 0.95; }
        94% { clip-path: inset(48% 0 38% 0); transform: translate(-2px, 0.5px); opacity: 0.75; }
        100% { clip-path: inset(18% 0 62% 0); transform: translate(-2.5px, 1px); opacity: 0.85; }
      }
      .glitchRed {
        opacity: 0.85;
        animation: glitchSliceRed 2.1s infinite steps(2, start);
      }
      @keyframes glitchSliceRed {
        0% { clip-path: inset(42% 0 38% 0); transform: translate(2.5px, -1px); opacity: 0.75; }
        10% { clip-path: inset(6% 0 82% 0); transform: translate(-2px, 1px); opacity: 0.9; }
        20% { clip-path: inset(68% 0 12% 0); transform: translate(3px, -0.5px); opacity: 0.4; }
        30% { clip-path: inset(22% 0 58% 0); transform: translate(-2.5px, 1.5px); opacity: 0.85; }
        40% { clip-path: inset(82% 0 4% 0); transform: translate(1.5px, -1px); opacity: 0.95; }
        50% { clip-path: inset(32% 0 48% 0); transform: translate(-3px, 0.5px); opacity: 0.5; }
        60% { clip-path: inset(8% 0 78% 0); transform: translate(2.5px, -1.5px); opacity: 0.9; }
        70% { clip-path: inset(78% 0 8% 0); transform: translate(-1.5px, 1px); opacity: 0.7; }
        80% { clip-path: inset(52% 0 28% 0); transform: translate(3px, -0.5px); opacity: 0.95; }
        90% { clip-path: inset(22% 0 58% 0); transform: translate(-2px, -1px); opacity: 0.6; }
        100% { clip-path: inset(42% 0 38% 0); transform: translate(2.5px, -1px); opacity: 0.75; }
      }
      .glitchScanBar {
        animation: glitchScanAnim 1.6s infinite linear;
      }
      @keyframes glitchScanAnim {
        0% { transform: translateY(110px); opacity: 0; }
        20% { transform: translateY(135px); opacity: 0.85; }
        25% { transform: translateY(145px); opacity: 0; }
        65% { transform: translateY(170px); opacity: 0.9; }
        70% { transform: translateY(185px); opacity: 0; }
        100% { transform: translateY(210px); opacity: 0; }
      }
    </style>
  </defs>

  <!-- Background Circular Plate -->
