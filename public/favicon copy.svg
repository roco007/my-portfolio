<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="100%" height="100%">
  <defs>
    <radialGradient id="discBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#282726" />
      <stop offset="60%" stop-color="#181716" />
      <stop offset="100%" stop-color="#0a0a09" />
    </radialGradient>
    <pattern id="frontRaster" width="8" height="6" patternUnits="userSpaceOnUse">
      <line x1="0" y1="3" x2="8" y2="3" stroke="#ff4b4b" stroke-width="1.6" opacity="0.75" />
      <animateTransform
        attributeName="patternTransform"
        type="translate"
        from="0,0"
        to="0,6"
        dur="0.85s"
        repeatCount="indefinite"
      />
    </pattern>
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <style>
      @keyframes waveBreathe {
        0%, 100% { transform: scale(0.96) rotate(45deg); filter: drop-shadow(0 0 6px rgba(255, 75, 75, 0.45)); }
        50% { transform: scale(1.03) rotate(45deg); filter: drop-shadow(0 0 16px rgba(255, 75, 75, 0.85)); }
      }
      @keyframes reticleSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes reticleSpinRev {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes dotFloat {
        0%, 100% { transform: translateY(-5px); }
        50% { transform: translateY(5px); }
      }
      .diamond {
        transform-origin: 160px 160px;
        animation: waveBreathe 4s ease-in-out infinite;
      }
      .spinFwd {
        transform-origin: 160px 160px;
        animation: reticleSpin 24s linear infinite;
      }
      .spinRev {
        transform-origin: 160px 160px;
        animation: reticleSpinRev 18s linear infinite;
      }
      .dot {
        animation: dotFloat 2.2s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Circular Plate -->
  <circle cx="160" cy="160" r="156" fill="url(#discBg)" stroke="rgba(255, 255, 255, 0.16)" stroke-width="3" />
  <circle cx="160" cy="160" r="150" fill="none" stroke="rgba(0, 0, 0, 0.7)" stroke-width="6" />

  <!-- Segmented Colorful Rim Arcs matching animejs -->
  <path d="M 80,48 A 136 136 0 0 1 155,24" fill="none" stroke="#8dff55" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 165,24 A 136 136 0 0 1 240,48" fill="none" stroke="#ff4b4b" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 248,56 A 136 136 0 0 1 292,132" fill="none" stroke="#ffa828" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 296,156 A 136 136 0 0 1 272,240" fill="none" stroke="#00ffaa" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 264,252 A 136 136 0 0 1 165,296" fill="none" stroke="#33b3f1" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 155,296 A 136 136 0 0 1 56,248" fill="none" stroke="#a369ff" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 48,236 A 136 136 0 0 1 24,160" fill="none" stroke="#ffcc2a" stroke-width="5.5" stroke-linecap="round" />
  <path d="M 24,152 A 136 136 0 0 1 72,56" fill="none" stroke="#ff718b" stroke-width="5.5" stroke-linecap="round" />

  <!-- Radial Ticks -->
