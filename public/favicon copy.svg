  <line x1="160" y1="40" x2="160" y2="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" transform="rotate(330 160 160)" />
  <line x1="160" y1="40" x2="160" y2="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" transform="rotate(340 160 160)" />
  <line x1="160" y1="40" x2="160" y2="46" stroke="rgba(255, 255, 255, 0.4)" stroke-width="1.2" transform="rotate(350 160 160)" />

  <!-- Inner Rotating Reticles -->
  <g class="spinFwd"><circle cx="160" cy="160" r="74" fill="none" stroke="rgba(0, 255, 170, 0.28)" stroke-width="1.4" stroke-dasharray="8 12" /></g>
  <g class="spinRev"><circle cx="160" cy="160" r="64" fill="none" stroke="rgba(255, 75, 75, 0.3)" stroke-width="1.2" stroke-dasharray="5 15" /></g>

  <!-- Central Diamond -->
  <g class="diamond">
    <rect x="114" y="114" width="92" height="92" rx="16" fill="url(#frontRaster)" stroke="#ff4b4b" stroke-width="2.2" />
  </g>

  <!-- Core Pulse -->
  <circle cx="160" cy="160" r="3.5" fill="#ff4b4b" />
  <circle cx="160" cy="160" r="9" fill="none" stroke="rgba(255, 75, 75, 0.4)" stroke-width="1.2" />

  <!-- Oscilloscope Sine Waveform -->
  <path d="M 68,155 Q 110,134 145,158 T 215,162 T 252,166" fill="none" stroke="rgba(255, 75, 75, 0.4)" stroke-width="5" filter="url(#neonGlow)" />
  <path d="M 68,155 Q 110,134 145,158 T 215,162 T 252,166" fill="none" stroke="#ff4b4b" stroke-width="2.2" stroke-linecap="round" />

