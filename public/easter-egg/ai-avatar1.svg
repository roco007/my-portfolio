<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Stylized AI avatar placeholder">
  <defs>
    <radialGradient id="vig" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#2a2733"/>
      <stop offset="62%" stop-color="#141220"/>
      <stop offset="100%" stop-color="#060509"/>
    </radialGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8d7466"/>
      <stop offset="100%" stop-color="#5c4a41"/>
    </linearGradient>
    <linearGradient id="beard" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a2d26"/>
      <stop offset="100%" stop-color="#241b16"/>
    </linearGradient>
    <linearGradient id="paint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff4b4b"/>
      <stop offset="100%" stop-color="#c22e2e"/>
    </linearGradient>
    <clipPath id="circle"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#circle)">
    <rect width="512" height="512" fill="url(#vig)"/>
    <!-- shoulders / fur armor -->
    <path d="M60 512 C90 400 160 360 256 360 C352 360 422 400 452 512 Z" fill="#221a15"/>
    <path d="M96 512 C120 430 170 398 256 398 C342 398 392 430 416 512 Z" fill="#2e231c"/>
    <!-- neck -->
    <rect x="216" y="300" width="80" height="90" rx="28" fill="url(#skin)"/>
    <!-- head -->
    <ellipse cx="256" cy="212" rx="118" ry="132" fill="url(#skin)"/>
    <!-- red war paint: diagonal stripe over scalp + eye -->
    <path d="M318 78 C300 110 288 140 292 168 C296 196 316 214 344 236 L372 208 C348 190 330 172 328 148 C326 122 336 98 352 76 Z" fill="url(#paint)"/>
    <path d="M292 168 C300 200 322 224 352 248 L330 274 C292 244 268 210 264 172 Z" fill="url(#paint)" opacity="0.92"/>
    <!-- brow ridge -->
    <path d="M158 186 C190 168 226 164 256 170 C286 164 322 168 354 186 L348 200 C318 184 286 180 256 186 C226 180 194 184 164 200 Z" fill="#3d3129"/>
    <!-- eyes: left open (amber), right winking -->
    <ellipse cx="206" cy="222" rx="22" ry="14" fill="#f3ece4"/>
    <circle cx="208" cy="222" r="9" fill="#d99a3c"/>
    <circle cx="208" cy="222" r="4.5" fill="#1c1207"/>
    <path d="M292 224 C304 216 322 216 334 224 C322 232 304 232 292 224 Z" fill="#1c1207"/>
    <path d="M300 236 C310 240 320 240 328 236" stroke="#4a3a30" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- nose -->
    <path d="M252 226 C246 252 240 268 232 280 C244 290 268 290 280 280 C272 268 266 252 260 226 Z" fill="#6b5648" opacity="0.85"/>
    <!-- beard -->
    <path d="M150 250 C158 330 196 384 256 392 C316 384 354 330 362 250 C356 306 322 330 256 336 C190 330 156 306 150 250 Z" fill="url(#beard)"/>
    <path d="M186 300 C196 356 222 384 256 388 C290 384 316 356 326 300 C312 330 288 346 256 350 C224 346 200 330 186 300 Z" fill="#1a130f" opacity="0.6"/>
    <!-- smirk -->
    <path d="M226 318 C244 330 276 330 296 314" stroke="#d8c7b8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <!-- scar under open eye -->
    <path d="M198 246 L192 268" stroke="#a5645a" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <!-- vignette edge -->
    <circle cx="256" cy="256" r="252" fill="none" stroke="#000" stroke-width="10" opacity="0.55"/>
  </g>
</svg>
